<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07080a" />
    <title>Sin conexión · RunTicket HN</title>
    <style>
      /* Página estática: no puede depender del CSS de la app, que no está en caché. */
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: #07080a; color: #f3f4f6;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center; padding: 24px;
      }
      main { max-width: 26rem; }
      img { width: 72px; height: 72px; margin-bottom: 20px; }
      .etiqueta { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: #8b8f98; }
      h1 { font-size: 1.5rem; line-height: 1.2; margin: 10px 0 12px; font-weight: 800; font-style: italic; text-transform: uppercase; }
      p { color: rgba(243,244,246,.72); font-size: .9375rem; line-height: 1.6; margin: 0 0 24px; }
      a { display: inline-block; padding: 12px 24px; border-radius: 999px; background: #ff6a1a; color: #0b0500; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <div class="etiqueta">Sin conexión</div>
      <h1>No hay internet ahora mismo</h1>
      <p>Tu inscripción, tu dorsal y tu pago siguen guardados. En cuanto vuelva la conexión, podrás verlos.</p>
      <a href="/">Reintentar</a>
    </main>
  </body>
</html>
